name: Security checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/scan_secrets.py
      - run: python3 tests/public-artifact.py
      - run: python3 scripts/build_public.py public-build
      - run: pip install -r server/requirements.txt pip-audit
      - run: pip-audit -r server/requirements.txt
      - name: Django security regression tests
        working-directory: server
        env:
          DJANGO_DEBUG: '1'
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          python manage.py test content
      - run: |
          set -e
          for script in tests/*.cjs; do node "$script"; done
  deployment-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Compose and proxy configurations
        run: |
          export DOMAIN=example.org
          export DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')"
          export POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          docker compose config --quiet
          docker build -f server/Gateway.Dockerfile -t ege-gateway-check .
          docker run --rm --add-host web:127.0.0.1 ege-gateway-check nginx -t
          docker run --rm -e DOMAIN=example.org -v "$PWD/server/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Check gateway isolation and throttling locally
        run: |
          docker run -d --name ege-gateway-smoke --add-host web:127.0.0.1 -p 127.0.0.1:18080:8080 ege-gateway-check
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(20):
              try:
                  urllib.request.urlopen('http://127.0.0.1:18080/index.html', timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit('Gateway did not start')
          PY
          python3 tests/gateway-security.py
      - if: always()
        run: docker rm -f ege-gateway-smoke || true

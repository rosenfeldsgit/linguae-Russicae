worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    # Only the Caddy container can supply the client address. No public backend ports.
    set_real_ip_from 172.30.74.2;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    limit_req_zone $binary_remote_addr zone=site:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=content:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip:10m;
    limit_conn_zone $server_name zone=total:1m;
    limit_req_status 429;
    limit_conn_status 429;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 15s;
    server {
        listen 8080;
        root /srv/public;
        index index.html;
        limit_req zone=site burst=100 nodelay;
        # Accommodate a school sharing one public IP. Tune from real traffic.
        limit_conn per_ip 128;
        limit_conn total 256;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        location = /admin { return 308 /admin/; }
        location = /admin/login/ {
            limit_req zone=site burst=100 nodelay;
            limit_req zone=login burst=5 nodelay;
            include /etc/nginx/proxy-ege.conf;
        }
        location /admin/ { include /etc/nginx/proxy-ege.conf; }
        location = /content.js {
            limit_req zone=site burst=100 nodelay;
            limit_req zone=content burst=20 nodelay;
            include /etc/nginx/proxy-ege.conf;
        }
        location /static/ {
            alias /srv/django/static/;
            expires 1h;
        }
        location ~ /\. { return 404; }
        location / { try_files $uri $uri/ =404; }
    }
}

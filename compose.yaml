services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ege
      POSTGRES_USER: ege
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: [CMD-SHELL, pg_isready -U ege -d ege]
      interval: 10s
      timeout: 3s
      retries: 10
  web:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: '0'
      DJANGO_ALLOWED_HOSTS: ${DOMAIN:?Set DOMAIN in .env}
      DJANGO_CSRF_ORIGINS: https://${DOMAIN}
      POSTGRES_DB: ege
      POSTGRES_USER: ege
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      EGE_DATA_DIR: /data
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 128
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  gateway:
    build:
      context: .
      dockerfile: server/Gateway.Dockerfile
    volumes:
      - appdata:/srv/django:ro
    depends_on: [web]
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 128
    logging: *logging
  proxy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports: ['80:80', '443:443']
    volumes:
      - ./server/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddyconfig:/config
    networks:
      default:
        ipv4_address: 172.30.74.2
    depends_on: [gateway]
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging
volumes:
  database:
  appdata:
  certificates:
  caddyconfig:
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.74.0/24
